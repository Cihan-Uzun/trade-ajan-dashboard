name: paper-mark
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark to market
        run: python3 .github/scripts/mark.py
      - name: Commit quotes
        run: |
          git config user.name "paper-mark"
          git config user.email "paper-mark@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "mark $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash origin main
          git push origin HEAD
